name: Collect Dalgubeol Traffic

on:
  workflow_dispatch:

  schedule:
    - cron: "30 0 * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect traffic data
        env:
          ITS_API_KEY: ${{ secrets.ITS_API_KEY }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: python collect_github.py
